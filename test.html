<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste de Imagens</title>
    <style>
        body {
            background: #000;
            color: #fff;
            padding: 20px;
        }
        .test-box {
            width: 300px;
            height: 200px;
            margin: 20px 0;
            border: 2px solid red;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <h1>Teste de Imagens</h1>
    
    <h2>onepiece.jpg</h2>
    <div class="test-box" style="background-image: url('onepiece.jpg')"></div>
    <img src="onepiece.jpg" width="300" style="border: 2px solid green;">
    
    <h2>demonslayer.jpg</h2>
    <div class="test-box" style="background-image: url('demonslayer.jpg')"></div>
    <img src="demonslayer.jpg" width="300" style="border: 2px solid blue;">
</body>
</html>
